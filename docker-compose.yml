services:
  app:
    build: .
    container_name: nest-auth-app
    env_file: .env
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - postgres
      - mailhog
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npm install && npm run start:dev"

  nginx:
    image: nginx:1.27-alpine
    container_name: nest-auth-nginx
    depends_on:
      - app
    environment:
      APP_PORT: ${PORT}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    command: >
      sh -c "envsubst '$$APP_PORT' < /etc/nginx/templates/app.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nest-auth.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.nest-auth.entrypoints=web"
      - "traefik.http.services.nest-auth.loadbalancer.server.port=80"
    networks:
      - default
      - traefik

  postgres:
    image: postgres:16-alpine
    container_name: nest-auth-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_EXT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: nest-auth-mailhog
    ports:
      - "${MAILHOG_WEBUI_PORT}:8025"  # Web UI
      - "${MAILHOG_SMTP_PORT}:1025"  # SMTP

volumes:
  pgdata:

networks:
  traefik:
    external: true
