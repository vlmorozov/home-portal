name: homeportal-${STACK}

services:
  hp_app:
    build:
      context: .
      target: production
    env_file: .env
    depends_on:
      - hp_db
      - hp_mailhog
    restart: unless-stopped

  hp_nginx:
    image: nginx:1.27-alpine
    depends_on:
      - hp_app
    env_file: .env
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    command: >
      sh -c "envsubst '$$PORT $$CORS_ALLOWED_HTTPS_HOST_REGEX' < /etc/nginx/templates/app.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"

  hp_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - hp_pgdata:/var/lib/postgresql/data

  hp_pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - hp_db

  hp_mailhog:
    image: mailhog/mailhog:v1.0.1


volumes:
  hp_pgdata:
    name: hp_pgdata_${STACK}
